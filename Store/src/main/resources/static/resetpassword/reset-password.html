<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contemporary - Redefinir Senha</title>    
    <!-- Tailwind CSS -->
    <script src="/js/tailwind.js"></script> 
    <script src="/js/tailwind-config.js"></script>
</head>

<body class="bg-background text-foreground min-h-screen">
    <!-- Header (idêntico ao login) -->
    <header class="border-b border-border sticky top-0 bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/60 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <!-- Logo -->
                <div class="flex items-center space-x-2">
                    <button id="mobileMenuBtn" class="md:hidden">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <h1 class="text-xl font-light tracking-wide cursor-pointer" onclick="window.location.href='/home'">CONTEMPORARY</h1>
                </div>

                <!-- Desktop Navigation -->
                <nav class="hidden md:flex items-center space-x-8">
                    <a href="/home" class="text-sm font-medium hover:text-primary/80 transition-colors">Início</a>
                    <a href="/produtos" class="text-sm font-medium hover:text-primary/80 transition-colors">Cadastrar</a>
                    <a href="/login" class="text-sm font-medium hover:text-primary/80 transition-colors">Login</a>
                </nav>

                <!-- Mobile Menu Button -->
                <div class="md:hidden">
                    <button class="text-sm font-medium hover:text-primary/80 transition-colors">
                        Menu
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md space-y-8">
            <!-- Título -->
            <div class="text-center">
                <h2 class="text-3xl font-light tracking-tight text-foreground">Redefinir Senha</h2>
                <p class="mt-2 text-sm text-muted-foreground" id="emailDisplay">
                    Digite sua nova senha
                </p>
            </div>

            <!-- Formulário -->
            <form id="resetForm" class="mt-8 space-y-6">
                <!-- Campo Token (oculto mas acessível) -->
                <div id="tokenSection" class="space-y-4">
                    <div>
                        <label for="token" class="block text-sm font-medium text-foreground mb-2">
                            Código de Verificação
                        </label>
                        <input 
                            id="token" 
                            name="token" 
                            type="text" 
                            required 
                            class="w-full px-3 py-2 border border-border rounded-md shadow-sm placeholder-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                            placeholder="Cole aqui o código do email"
                        >
                        <p class="mt-1 text-xs text-muted-foreground">
                            Verifique seu email e cole o código de verificação aqui
                        </p>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label for="newPassword" class="block text-sm font-medium text-foreground mb-2">
                            Nova Senha
                        </label>
                        <input 
                            id="newPassword" 
                            name="newPassword" 
                            type="password" 
                            autocomplete="new-password" 
                            required 
                            minlength="6"
                            class="w-full px-3 py-2 border border-border rounded-md shadow-sm placeholder-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                            placeholder="Mínimo 6 caracteres"
                        >
                    </div>
                    
                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-foreground mb-2">
                            Confirmar Nova Senha
                        </label>
                        <input 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            type="password" 
                            autocomplete="new-password" 
                            required 
                            minlength="6"
                            class="w-full px-3 py-2 border border-border rounded-md shadow-sm placeholder-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                            placeholder="Repita a senha"
                        >
                    </div>
                </div>

                <!-- Mensagem de Status -->
                <div id="message" class="hidden p-4 rounded-md"></div>

                <!-- Botão -->
                <div>
                    <button 
                        type="submit" 
                        id="submitBtn"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-primary-foreground bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors"
                    >
                        Redefinir Senha
                    </button>
                </div>

                <!-- Link de Volta -->
                <div class="text-center">
                    <a href="/login" class="text-sm text-primary hover:text-primary/80 transition-colors">
                        ← Voltar ao Login
                    </a>
                </div>
            </form>
        </div>
    </main>

    <script>
        function showMessage(message, type = 'info') {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `p-4 rounded-md ${type === 'success' ? 'bg-green-50 text-green-800 border border-green-200' : type === 'error' ? 'bg-red-50 text-red-800 border border-red-200' : 'bg-blue-50 text-blue-800 border border-blue-200'}`;
            messageDiv.textContent = message;
            messageDiv.classList.remove('hidden');
        }
        
        // ✅ VERIFICAR SE VEIO DO FLUXO CORRETO
        window.addEventListener('DOMContentLoaded', function() {
            const resetEmail = localStorage.getItem('resetEmail');
            const urlToken = new URLSearchParams(window.location.search).get('token');
            
            if (resetEmail) {
                document.getElementById('emailDisplay').textContent = `Redefinindo senha para: ${resetEmail}`;
            }
            
            // ✅ SE VEIO COM TOKEN NA URL, PREENCHER AUTOMATICAMENTE
            if (urlToken) {
                document.getElementById('token').value = urlToken;
                document.getElementById('tokenSection').style.display = 'none';
                showMessage('Código de verificação detectado automaticamente!', 'success');
            }
        });
        
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const token = document.getElementById('token').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            
            // Validações
            if (!token) {
                showMessage('Código de verificação é obrigatório', 'error');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                showMessage('As senhas não coincidem', 'error');
                return;
            }
            
            if (newPassword.length < 6) {
                showMessage('A senha deve ter pelo menos 6 caracteres', 'error');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Alterando...';
            
            // ✅ TENTAR SELLER PRIMEIRO, DEPOIS CUSTOMER
            function trySellerEndpoint() {
                return fetch('/registerseller/public/change-password/999', {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword
                    })
                });
            }
            
            function tryCustomerEndpoint() {
                return fetch('/register/public/change-password/999', {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        newPassword: newPassword
                    })
                });
            }
            
            trySellerEndpoint()
            .then(response => response.json().then(data => ({ response, data })))
            .then(({ response, data }) => {
                if (response.ok && (data.verificado || data.mensagem)) {
                    // Sucesso como SELLER
                    showMessage('Senha alterada com sucesso! Redirecionando para login...', 'success');
                    
                    // Limpar localStorage
                    localStorage.removeItem('resetEmail');
                    
                    // Redirecionar para login após 2 segundos
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    // Falhou como SELLER, tentar CUSTOMER
                    return tryCustomerEndpoint()
                    .then(response => response.json().then(data => ({ response, data })))
                    .then(({ response, data }) => {
                        if (response.ok && (data.verificado || data.mensagem)) {
                            showMessage('Senha alterada com sucesso! Redirecionando para login...', 'success');
                            
                            localStorage.removeItem('resetEmail');
                            
                            setTimeout(() => {
                                window.location.href = '/login';
                            }, 2000);
                        } else {
                            showMessage(data.erro || 'Erro ao alterar senha', 'error');
                        }
                    });
                }
            })
            .catch(error => {
                showMessage('Erro ao alterar senha: ' + error.message, 'error');
                console.error('Erro:', error);
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Redefinir Senha';
            });
        });
    </script>
</body>
</html>
