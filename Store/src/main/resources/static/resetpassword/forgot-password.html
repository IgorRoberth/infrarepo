<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contemporary - Esqueci Minha Senha</title>
    
    <script src="/js/tailwind.js"></script> 
    <script src="/js/tailwind-config.js"></script>
</head>
<body class="bg-background text-foreground min-h-screen">
    <!-- Header (idêntico ao login) -->
    <header class="border-b border-border sticky top-0 bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/60 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <!-- Logo -->
                <div class="flex items-center space-x-2">
                    <button id="mobileMenuBtn" class="md:hidden">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <h1 class="text-xl font-light tracking-wide cursor-pointer" onclick="window.location.href='/home'">CONTEMPORARY</h1>
                </div>

                <!-- Desktop Navigation -->
                <nav class="hidden md:flex items-center space-x-8">
                    <a href="/home" class="text-sm font-medium hover:text-primary/80 transition-colors">Início</a>
                    <a href="/produtos" class="text-sm font-medium hover:text-primary/80 transition-colors">Cadastrar</a>
                    <a href="/login" class="text-sm font-medium hover:text-primary/80 transition-colors">Login</a>
                </nav>

                <!-- Mobile Menu Button -->
                <div class="md:hidden">
                    <button class="text-sm font-medium hover:text-primary/80 transition-colors">
                        Menu
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md space-y-8">
            <!-- Título -->
            <div class="text-center">
                <h2 class="text-3xl font-light tracking-tight text-foreground">Esqueci Minha Senha</h2>
                <p class="mt-2 text-sm text-muted-foreground">
                    Digite seu email para receber instruções de redefinição
                </p>
            </div>

            <!-- Formulário -->
            <form id="forgotForm" class="mt-8 space-y-6">
                <div class="space-y-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-foreground mb-2">
                            Email
                        </label>
                        <input 
                            id="email" 
                            name="email" 
                            type="email" 
                            autocomplete="email" 
                            required 
                            class="w-full px-3 py-2 border border-border rounded-md shadow-sm placeholder-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                            placeholder="seu@email.com"
                        >
                    </div>
                </div>

                <!-- Mensagem de Status -->
                <div id="message" class="hidden p-4 rounded-md"></div>

                <!-- Botão -->
                <div>
                    <button 
                        type="submit" 
                        id="submitBtn"
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-primary-foreground bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors"
                    >
                        Enviar Instruções
                    </button>
                </div>

                <!-- Link de Volta -->
                <div class="text-center">
                    <a href="/login" class="text-sm text-primary hover:text-primary/80 transition-colors">
                        ← Voltar ao Login
                    </a>
                </div>
            </form>
        </div>
    </main>

    <script>
        function showMessage(message, type = 'info') {
            const messageDiv = document.getElementById('message');
            messageDiv.className = `p-4 rounded-md ${type === 'success' ? 'bg-green-50 text-green-800 border border-green-200' : type === 'error' ? 'bg-red-50 text-red-800 border border-red-200' : 'bg-blue-50 text-blue-800 border border-blue-200'}`;
            messageDiv.textContent = message;
            messageDiv.classList.remove('hidden');
        }

        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const submitBtn = document.getElementById('submitBtn');

            if (!email) {
                showMessage('Email é obrigatório', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';

            // ✅ ENVIAR SOLICITAÇÃO E ARMAZENAR EMAIL NO LOCALSTORAGE
            fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email: email })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // ✅ ARMAZENAR EMAIL PARA PRÓXIMA ETAPA
                    localStorage.setItem('resetEmail', email);

                    showMessage('Instruções enviadas! Verifique seu email e clique no link recebido.', 'success');

                    // ✅ REDIRECIONAR PARA PÁGINA DE RESET APÓS 3 SEGUNDOS
                    setTimeout(() => {
                        window.location.href = '/resetpassword/reset-password.html';
                    }, 3000);
                } else {
                    showMessage('Instruções enviadas! Se o email existir, você receberá as instruções.', 'success');
                }
            })
            .catch(error => {
                showMessage('Erro ao enviar solicitação. Tente novamente.', 'error');
                console.error('Erro:', error);
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Enviar Instruções';
            });
        });
    </script>
</body>
</html>
