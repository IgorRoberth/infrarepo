<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contemporary - Cadastro de Produto</title>
    <script src="/js/tailwind.js"></script> 
    <script src="/js/tailwind-config.js"></script>
    
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#fafafa] text-foreground min-h-screen flex flex-col font-sans">

    <header class="border-b border-border bg-white sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-xl font-light tracking-[0.2em]">CONTEMPORARY</h1>
            
            <nav class="hidden md:flex items-center space-x-8">
                <a href="/home/index" class="text-sm font-medium hover:opacity-60 transition-opacity">Início</a>
                <a href="/produtos/upload" class="text-sm font-semibold border-b-2 border-primary pb-1">Cadastrar Produto</a>
            </nav>

            <button id="logoutBtn" class="w-10 h-10 flex items-center justify-center rounded-full border border-border hover:bg-secondary transition-all">
                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 lg:py-12 flex-grow">
        <div class="text-center mb-10">
            <h2 class="text-3xl font-light mb-2">Cadastrar Novo Produto</h2>
            <p class="text-muted-foreground text-sm">Adicione produtos ao seu catálogo</p>
        </div>

        <div class="max-w-5xl mx-auto bg-white border border-border rounded-lg p-6 lg:p-10 shadow-sm">
            <form id="productForm" class="space-y-8" onsubmit="return false;">
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-x-12 gap-y-8">
                    
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-bold mb-2">Nome do Produto *</label>
                            <input type="text" id="nome" name="nome" required 
                                   class="w-full px-3 py-2 border border-gray-200 rounded focus:border-primary outline-none text-sm"
                                   placeholder="Ex: Smartphone Galaxy S24">
                        </div>

                        <div>
                            <label class="block text-sm font-bold mb-2">Descrição *</label>
                            <textarea id="descricao" name="descricao" rows="5" required 
                                      class="w-full px-3 py-2 border border-gray-200 rounded focus:border-primary outline-none text-sm resize-none"
                                      placeholder="Descreva as características e benefícios do produto..."></textarea>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold mb-2">Preço (R$) *</label>
                                <input type="number" id="preco" name="preco" step="0.01" min="0" 
                                       oninput="if(this.value < 0) this.value = 0" required
                                       class="w-full px-3 py-2 border border-gray-200 rounded outline-none focus:border-primary text-sm"
                                       placeholder="0,00">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-2">Estoque *</label>
                                <input type="number" id="estoque" name="estoque" min="0" 
                                       oninput="if(this.value < 0) this.value = 0" required
                                       class="w-full px-3 py-2 border border-gray-200 rounded outline-none focus:border-primary text-sm"
                                       placeholder="0">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-bold mb-2">Categoria *</label>
                                <select id="categoria" name="categoria" required 
                                        class="w-full px-3 py-2 border border-gray-200 rounded outline-none focus:border-primary text-sm bg-white cursor-pointer">
                                    <option value="">Selecione uma categoria</option>
                                    <option value="eletronicos">Eletrônicos</option>
                                    <option value="roupas">Roupas & Acessórios</option>
                                    <option value="casa">Casa & Decoração</option>
                                    <option value="esportes">Esportes & Lazer</option>
                                    <option value="livros">Livros & Educação</option>
                                    <option value="alimenticio">Alimentos & Bebidas</option>
                                    <option value="beleza">Beleza & Cuidados</option>
                                    <option value="outros">Outros</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-2">Marca</label>
                                <input type="text" id="marca" name="marca" 
                                       class="w-full px-3 py-2 border border-gray-200 rounded outline-none focus:border-primary text-sm"
                                       placeholder="Ex: Nike, Apple, Samsung">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold mb-2">SKU (Código do Produto)</label>
                            <input type="text" id="sku" name="sku" 
                                   class="w-full px-3 py-2 border border-gray-200 rounded outline-none focus:border-primary text-sm"
                                   placeholder="Ex: CAM-BAS-001">
                            <p class="text-[10px] text-gray-400 mt-1 uppercase font-semibold">Deixe em branco para gerar automaticamente</p>
                        </div>
                    </div>

                    <div class="space-y-8">
                        <div>
                            <label class="block text-sm font-bold mb-2">Imagem do Produto *</label>
                            <div id="uploadArea" class="border-2 border-dashed border-gray-200 rounded-lg p-10 text-center hover:bg-gray-50 transition-all cursor-pointer group relative">
                                <input type="file" id="productImage" accept="image/*" class="hidden">
                                
                                <div id="uploadPlaceholder">
                                    <svg class="w-12 h-12 mx-auto mb-4 text-gray-300 group-hover:text-primary transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                                    </svg>
                                    <p class="text-gray-500 text-base mb-1">Clique para selecionar uma imagem</p>
                                    <p class="text-gray-400 text-xs uppercase font-semibold">PNG, JPG ou JPEG até 5MB</p>
                                </div>

                                <div id="imagePreview" class="hidden">
                                    <img id="previewImg" src="" alt="Preview" class="max-w-full max-h-60 mx-auto rounded shadow-sm">
                                    <button type="button" id="removeBtn" class="mt-3 text-red-500 hover:underline text-xs font-bold uppercase">Remover Imagem</button>
                                </div>
                            </div>
                        </div>

                        <div class="bg-[#f8f9fa] rounded-lg p-6 border border-gray-100">
                            <h3 class="text-sm font-bold mb-4 uppercase tracking-wider">Informações Adicionais</h3>
                            <label class="flex items-center space-x-3 cursor-pointer">
                                <input type="checkbox" id="ativo" name="ativo" checked 
                                       class="w-4 h-4 rounded border-gray-300 text-primary focus:ring-primary">
                                <span class="text-gray-700 text-sm font-medium">Produto ativo (visível na loja)</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="pt-6 border-t border-gray-100">
                    <div class="flex flex-col md:flex-row justify-end items-center space-y-4 md:space-y-0 md:space-x-4 mb-6">
                        <button type="button" onclick="history.back()" 
                                class="w-full md:w-auto px-8 py-2.5 text-sm font-bold border border-gray-200 rounded hover:bg-gray-50 transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" id="submitBtn" 
                                class="w-full md:w-auto px-10 py-2.5 bg-[#030213] text-white text-sm font-bold rounded hover:bg-opacity-90 transition-all active:scale-[0.98]">
                            <span id="submitText">Cadastrar Produto</span>
                            <span id="loadingText" class="hidden">Cadastrando...</span>
                        </button>
                    </div>

                    <div id="messageContainer" class="hidden w-full max-w-md ml-auto fade-in">
                        <div id="messageContent" class="p-4 rounded-md text-sm font-medium border"></div>
                    </div>
                </div>
            </form>
        </div>
    </main>

    <footer class="py-6 border-t border-border bg-white">
        <div class="container mx-auto px-4 text-center">
            <p class="text-xs text-gray-400">&copy; 2024 Contemporary. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="/produtos/upload.js"></script>
</body>
</html>
