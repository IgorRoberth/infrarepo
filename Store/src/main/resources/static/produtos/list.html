<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contemporary - Meus Produtos</title>
    <script src="/js/tailwind.js"></script> 
    <script src="/js/tailwind-config.js"></script>
</head>

<body class="bg-background text-foreground min-h-screen flex flex-col">
    <header class="border-b border-border sticky top-0 bg-background/95 backdrop-blur z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <h1 class="text-xl font-light tracking-wide">CONTEMPORARY</h1>
                    <span class="text-xs bg-primary text-primary-foreground px-2 py-1 rounded">VENDEDOR</span>
                </div>
                <nav class="hidden md:flex items-center space-x-8">
                    <a href="/home/index" class="text-sm font-medium hover:text-primary/80 transition-colors">Início</a>
                    <a href="/produtos/upload" class="text-sm font-medium hover:text-primary/80 transition-colors">Cadastrar Produto</a>
                    <a href="/produtos/list" class="text-sm font-medium text-primary border-b-2 border-primary">Meus Produtos</a>
                </nav>
                <div class="flex items-center space-x-4">
                    <button id="logoutBtn" class="p-2 hover:bg-secondary rounded-full transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 flex-grow">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8">
            <div>
                <h2 class="text-3xl font-light mb-2">Meus Produtos</h2>
                <p class="text-muted-foreground">Gerencie seu catálogo de vendas</p>
            </div>
        </div>

        <div id="loadingState" class="hidden py-16 text-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary mx-auto"></div>
            <p class="mt-4 text-muted-foreground">Carregando catálogo...</p>
        </div>

        <div id="emptyState" class="hidden py-16 text-center bg-secondary/30 rounded-lg border border-dashed border-border">
            <h3 class="text-lg font-medium text-foreground mb-2">Nenhum produto cadastrado</h3>
            <p class="text-muted-foreground mb-6">Comece a vender agora mesmo.</p>
            <a href="/produtos/upload" class="text-primary hover:underline font-medium">Cadastrar Primeiro Produto</a>
        </div>

        <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>

    <div id="editModal" class="fixed inset-0 bg-black/50 hidden z- flex items-center justify-center p-4">
        <div class="bg-white rounded-lg w-full max-w-md p-6 shadow-xl">
            <h3 class="text-xl font-semibold mb-4">Editar Produto</h3>
            <form id="editForm" class="space-y-4">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nome</label>
                    <input type="text" id="edit-nome" class="w-full border rounded-md p-2 outline-none focus:ring-1 focus:ring-primary">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Preço (R$)</label>
                        <input type="number" step="0.01" id="edit-preco" class="w-full border rounded-md p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Estoque</label>
                        <input type="number" id="edit-estoque" class="w-full border rounded-md p-2">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Descrição</label>
                    <textarea id="edit-descricao" rows="3" class="w-full border rounded-md p-2"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Categoria</label>
                    <input type="text" id="edit-categoria" class="w-full border rounded-md p-2">
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeEditModal()" class="flex-1 px-4 py-2 border rounded-md hover:bg-gray-50">Cancelar</button>
                    <button type="submit" class="flex-1 px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/produtos/list.js"></script>
</body>
</html>
